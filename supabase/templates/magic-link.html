<!doctype html>
<html lang="bg">
  <body style="margin:0;padding:24px 0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#171717;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;">
            <tr>
              <td style="padding:32px 28px;">
                <h1 style="font-size:20px;line-height:28px;margin:0 0 16px;">Вход в админ панела</h1>
                <p style="font-size:16px;line-height:24px;margin:0 0 16px;">
                  Получихме заявка за вход в админ панела за профилактични прегледи с този имейл.
                </p>
                <p style="margin:0 0 20px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                     style="display:inline-block;background:#171717;color:#ffffff;border-radius:6px;padding:12px 20px;font-size:16px;font-weight:600;text-decoration:none;">
                    Отвори страницата за вход
                  </a>
                </p>
                <p style="font-size:14px;line-height:20px;color:#666666;margin:0 0 8px;">
                  Линкът е валиден еднократно и за ограничено време. На страницата натиснете „Влез“.
                </p>
                <p style="font-size:14px;line-height:20px;color:#666666;margin:0;">
                  Ако не сте поискали вход, игнорирайте този имейл.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
