# Daily encrypted database backup (see README → "Бекъп").
#
# Required repository secrets:
#   SUPABASE_DB_URL     Session pooler connection string (IPv4; GitHub runners
#                       have no IPv6, so the direct connection does not work)
#   BACKUP_PASSPHRASE   long random passphrase; keep a copy outside GitHub,
#                       without it the backup can not be restored
name: Database backup

on:
  schedule:
    - cron: "30 0 * * *" # daily, 00:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::SUPABASE_DB_URL secret is missing"; exit 1; }
          test ${#BACKUP_PASSPHRASE} -ge 20 || { echo "::error::BACKUP_PASSPHRASE is missing or shorter than 20 characters"; exit 1; }

      - name: Dump (pg_dump 17)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          # Application data (public schema) and auth users (for admins).
          # rate_limit_hits holds only short-lived hashes and is skipped.
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            pg_dump "$SUPABASE_DB_URL" \
              --format=custom --no-owner --no-privileges \
              --schema=public --schema=auth \
              --exclude-table-data=public.rate_limit_hits \
            > backup/db.dump
          test -s backup/db.dump

      - name: Encrypt (AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d)
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "backup/profilaktika-$stamp.dump.gpg" backup/db.dump
          shred -u backup/db.dump
          ls -l backup

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.gpg
          retention-days: 90
          if-no-files-found: error
